<text x="520" y="93" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#183329">Гр. 1</text>
<text x="520" y="115" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5C6F63">Светильники L1–N, PE</text>
