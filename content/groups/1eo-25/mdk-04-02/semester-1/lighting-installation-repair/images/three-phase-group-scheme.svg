<line x1="456" y1="260" x2="500" y2="260" stroke="#2B3A31" stroke-width="2.5"/>
<rect x="500" y="232" width="410" height="56" rx="5" fill="#EAF2EC" stroke="#D7E2D9" stroke-width="1.2"/>
<text x="520" y="253" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#183329">Гр. 3</text>
