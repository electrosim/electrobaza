<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="t d">
<title id="t">Схема трёхфазной групповой линии освещения</title>
<desc id="d">Ввод 3 фазы, нейтраль и PE, автомат QF1, три группы освещения с автоматами QF2, QF3, QF4, общие шины N и PE.</desc>
<rect width="1000" height="500" fill="#FFFFFF"/>
<text x="30" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700" fill="#183329">Схема трёхфазной групповой линии освещения</text>
<text x="30" y="57" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#5C6F63">3×230/400 В, 50 Гц · пятипроводная линия · группы L1, L2, L3</text>
<rect x="30" y="100" width="155" height="100" rx="8" fill="#FFFFFF" stroke="#D7E2D9" stroke-width="1.5"/>
<text x="107" y="127" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#183329">Ввод</text>
<text x="107" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5C6F63">3×230/400 В</text>
<text x="107" y="168" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5C6F63">L1 · L2 · L3</text>
<text x="107" y="187" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5C6F63">N · PE</text>
<line x1="185" y1="150" x2="220" y2="150" stroke="#2B3A31" stroke-width="3"/>
<rect x="220" y="120" width="92" height="60" rx="6" fill="#EAF2EC" stroke="#2F7D5A" stroke-width="1.5"/>
<text x="266" y="145" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#183329">QF1</text>
<text x="266" y="164" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5C6F63">4P</text>
<line x1="312" y1="150" x2="350" y2="150" stroke="#2B3A31" stroke-width="3"/>
<line x1="350" y1="95" x2="350" y2="285" stroke="#2B3A31" stroke-width="3"/>
