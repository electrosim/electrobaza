<line x1="905" y1="390" x2="905" y2="300" stroke="#1F5FA8" stroke-width="1.2" stroke-dasharray="5 4"/>
<line x1="920" y1="435" x2="920" y2="300" stroke="#2F7D5A" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="930" y="365" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5C6F63">N</text>
<text x="930" y="420" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#5C6F63">PE</text>
<text x="30" y="470" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#5C6F63">N и PE — общие; выключатели ставят только в фазном проводе.</text>
