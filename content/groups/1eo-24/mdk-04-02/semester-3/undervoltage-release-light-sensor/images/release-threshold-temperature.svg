<svg xmlns="http://www.w3.org/2000/svg" width="460" height="340" viewBox="0 0 460 340" role="img" aria-labelledby="title-temp desc-temp">
  <title id="title-temp">Напряжение отпускания расцепителя при нагреве катушки</title>
  <desc id="desc-temp">Линейный график: при 20 градусах напряжение 12 вольт, при 40 градусах 12,96 вольта, при 60 градусах 13,92 вольта.</desc>
  <rect width="460" height="340" fill="#ffffff"/>
  <text x="70" y="20" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#5c6f63">R20 = 192 Ом; α = 0,004 1/°C</text>
  <rect x="64" y="30" width="380" height="256" fill="#fbfdfb" stroke="#dbe4dc" stroke-width="1"/>
  <g stroke="#dbe4dc" stroke-width="1">
    <line x1="64" y1="243.3" x2="444" y2="243.3"/>
    <line x1="64" y1="200.7" x2="444" y2="200.7"/>
    <line x1="64" y1="158" x2="444" y2="158"/>
    <line x1="64" y1="115.3" x2="444" y2="115.3"/>
    <line x1="64" y1="72.7" x2="444" y2="72.7"/>
    <line x1="64" y1="30" x2="444" y2="30"/>
    <line x1="159" y1="30" x2="159" y2="286"/>
    <line x1="254" y1="30" x2="254" y2="286"/>
    <line x1="349" y1="30" x2="349" y2="286"/>
    <line x1="444" y1="30" x2="444" y2="286"/>
  </g>
  <line x1="64" y1="286" x2="444" y2="286" stroke="#7d8f83" stroke-width="1.5"/>
  <line x1="64" y1="30" x2="64" y2="286" stroke="#7d8f83" stroke-width="1.5"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#2b3a31" text-anchor="end">
    <text x="58" y="291.5">11,5</text>
    <text x="58" y="248.8">12,0</text>
    <text x="58" y="206.2">12,5</text>
    <text x="58" y="163.5">13,0</text>
    <text x="58" y="120.8">13,5</text>
    <text x="58" y="78.2">14,0</text>
    <text x="58" y="35.5">14,5</text>
  </g>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#2b3a31" text-anchor="middle">
    <text x="64" y="308">20</text>
    <text x="159" y="308">30</text>
    <text x="254" y="308">40</text>
    <text x="349" y="308">50</text>
