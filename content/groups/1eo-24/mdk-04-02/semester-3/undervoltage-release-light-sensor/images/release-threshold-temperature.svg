  <text x="14" y="158" transform="rotate(-90 14 158)" font-family="Segoe UI, Arial, sans-serif" font-size="19" fill="#2b3a31" text-anchor="middle">Uотп, В</text>
  <line x1="64" y1="243.3" x2="444" y2="243.3" stroke="#b3261e" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="265" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#b3261e">12 В при 20 °C</text>
  <polyline points="64,243.3 159,202.4 254,161.4 349,120.5 444,79.5" fill="none" stroke="#1f6b4a" stroke-width="2.5" stroke-linejoin="round"/>
