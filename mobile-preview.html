<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Электробаза — мобильный просмотр</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background: #dfe7df;
      font-family: Arial, Helvetica, sans-serif;
    }
    .phone {
      width: min(390px, 100%);
      height: min(844px, calc(100vh - 48px));
      overflow: hidden;
      border: 10px solid #17241d;
      border-radius: 42px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(18, 36, 27, .28);
    }
    .phone iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }
    @media (max-width: 640px) {
      body { display: block; padding: 0; background: #fff; }
      .phone {
        width: 100%;
        height: 100dvh;
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="phone">
    <iframe src="index.html#/" title="Электробаза — интерактивная мобильная версия"></iframe>
  </div>
</body>
</html>
